<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIBN BOT — Account</title><style>body{margin:0;background:#06100c;color:#eafff6;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 28px));padding:28px;border:1px solid rgba(120,255,214,.16);border-radius:24px;background:rgba(8,22,17,.94)}a{color:#14e6a6;text-decoration:none}.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1;padding:10px;border:1px solid rgba(120,255,214,.14);border-radius:10px;background:rgba(255,255,255,.04);color:#8fa8a0}.tabs button.on{color:#14e6a6;border-color:rgba(20,230,166,.4)}form{display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#8fa8a0}.field input{height:44px;border-radius:11px;border:1px solid rgba(120,255,214,.14);background:#020705;color:#eafff6;padding:0 12px}.submit{height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#14e6a6,#0fb5d6);font-weight:800}.hidden{display:none}.status{margin:10px 0;padding:10px;border-radius:10px;background:rgba(20,230,166,.08);font-size:11px}</style></head><body><section class="card"><div><a href="/">← CIBN BOT</a></div><h1 id="title">Welcome back.</h1><p id="intro">Your CIBN BOT account keeps your journey together.</p><div class="tabs"><button class="on" data-m="login">Sign in</button><button data-m="signup">Create account</button><button data-m="recover">Forgot password</button></div><div id="status"></div><form id="f"><div id="name" class="field hidden"><label>Full name</label><input name="full_name" autocomplete="name"></div><div id="phone" class="field hidden"><label>Phone number</label><input name="phone" inputmode="tel" autocomplete="tel"></div><div id="email" class="field"><label>Email</label><input name="email" type="email" autocomplete="email"></div><div id="pass" class="field"><label id="pl">Password</label><input name="password" type="password" autocomplete="current-password"></div><div id="confirm" class="field hidden"><label>Confirm password</label><input name="confirm" type="password" autocomplete="new-password"></div><button class="submit">Sign in</button></form></section><script>(function(){const A='https://noun-student-bot-dashboard.vercel.app/api/dashboard',f=document.getElementById('f'),s=document.getElementById('status');let m='login';function show(id,on){document.getElementById(id).classList.toggle('hidden',!on)}function render(){show('name',m==='signup');show('phone',m==='signup');show('email',m!=='reset');show('pass',m!=='recover');show('confirm',m==='signup'||m==='reset');document.querySelector('#pl').textContent=m==='reset'?'New password':'Password';document.querySelector('.submit').textContent=m==='signup'?'Create account':m==='recover'?'Send recovery link':m==='reset'?'Update password':'Sign in';document.getElementById('title').textContent=m==='signup'?'Create your CIBN BOT account':m==='recover'?'Reset your password':m==='reset'?'Choose a new password':'Welcome back.';document.getElementById('intro').textContent=m==='recover'?'We will email a secure recovery link.':m==='reset'?'Set a new password for your account.':'Your account keeps your CIBN BOT journey together.'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{m=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');s.textContent='';render()});function msg(x){s.className='status';s.textContent=x}async function post(route,b){const r=await fetch(A+'?route='+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'cibn',...b})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function save(x){if(x&&x.access_token){sessionStorage.setItem('cibn_access_token',x.access_token);sessionStorage.setItem('cibn_refresh_token',x.refresh_token||'')}}function recovery(){return new URLSearchParams(location.hash.slice(1)).get('access_token')||''}f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));try{if(m==='signup'){if(v.password!==v.confirm)throw Error('Passwords do not match.');const d=await post('auth-signup',{full_name:v.full_name,email:v.email,phone:v.phone,password:v.password});save(d.session);msg('Account created.');setTimeout(()=>location.href='/account/',500)}else if(m==='login'){const d=await post('auth-login',{email:v.email,password:v.password});save(d.session);msg('Signed in.');setTimeout(()=>location.href='/account/',400)}else if(m==='recover'){await post('auth-recover',{email:v.email});msg('Check your email for the recovery link.')}else{const token=recovery();if(!token)throw Error('This recovery link has expired or is incomplete.');if(v.password!==v.confirm)throw Error('Passwords do not match.');await post('auth-reset',{access_token:token,password:v.password});history.replaceState(null,'',location.pathname);m='login';msg('Password updated.');render()}}catch(e){msg(e.message)}};if(recovery()){m='reset';document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'))}render()})();</script></body></html>
